name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://minh-hahaha:$HF_TOKEN@huggingface.co/spaces/minh-hahaha/CaseStudy1 main

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK configured, skipping notification."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request

          status = os.environ["STATUS"]
          icon = {"success": "✅", "failure": "❌"}.get(status, "⚠️")
          payload = {
              "content": (
                  f"{icon} **MemeForge sync-to-hf: {status}**\n"
                  f"Commit `{os.environ['GITHUB_SHA'][:7]}` on "
                  f"`{os.environ['GITHUB_REF_NAME']}` by {os.environ['GITHUB_ACTOR']}\n"
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )
          }
          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  # Discord's Cloudflare edge 403s the default Python-urllib
                  # User-Agent as bot traffic; a normal-looking one gets through.
                  "User-Agent": "Mozilla/5.0 (compatible; GitHubActionsBot/1.0)",
              },
          )
          with urllib.request.urlopen(request) as response:
              print("Discord responded", response.status)
          PY
