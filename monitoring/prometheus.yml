# Prometheus scrape config for Case Study 3 (group 7).
# Prometheus runs in its own container on the group7_net Docker network, so it
# reaches the product containers by name on their *internal* ports. The VM-side
# ports (4700-4709) are only for humans, ngrok, and SSH tunnels.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api_app      # prometheus_client metrics from the API product
    static_configs:
      - targets: ['group7_api:8000']
  - job_name: api_node     # prometheus-node-exporter inside the API container
    static_configs:
      - targets: ['group7_api:9100']
  - job_name: local_app    # prometheus_client metrics from the local product
    static_configs:
      - targets: ['group7_local:8000']
  - job_name: local_node   # prometheus-node-exporter inside the local container
    static_configs:
      - targets: ['group7_local:9100']
